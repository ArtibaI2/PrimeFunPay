version: '3.8'

services:
  funpaybot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: funpay_bot
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite database, goods, and logs outside container
      - ./storage:/app/storage
      # Mount configuration
      - ./.env:/app/.env
    environment:
      - TZ=Europe/Moscow
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
